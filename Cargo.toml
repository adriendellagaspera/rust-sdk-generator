[workspace]
members = [".", "openapi-to-rust-bindings"]
resolver = "3"

[package]
name = "rust-sdk-generator"
version = "0.2.8"
edition = "2024"
rust-version = "1.88"
description = "Deterministic derivation and generation of idiomatic Rust SDK surfaces from OpenAPI and normalized bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adriendellagaspera/rust-sdk-generator"

[lib]
name = "rust_sdk_generator"
path = "src/lib.rs"

[[example]]
name = "independent-sdk-quickstart"
path = "examples/independent-sdk/quickstart.rs"

[dependencies]
indexmap = { version = "2.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
