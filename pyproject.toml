[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rust-sdk-generator"
version = "0.2.8"
description = "Deterministic derivation and generation of idiomatic Rust SDK surfaces from OpenAPI and normalized bindings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
  "ruamel.yaml==0.19.1",
  "jsonschema==4.26.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rust_sdk_generator"]
include-package-data = true

[tool.setuptools.package-data]
rust_sdk_generator = ["*.json"]
