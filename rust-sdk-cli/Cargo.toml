[package]
name = "rust-sdk-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Installable OpenAPI-to-Rust SDK init and sync CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adriendellagaspera/rust-sdk-generator"
readme = "README.md"

[[bin]]
name = "rust-sdk"
path = "src/main.rs"

[dependencies]
rust-sdk-generator = { path = "..", version = "=0.2.8" }
openapi-to-rust-bindings = { path = "../openapi-to-rust-bindings", version = "=0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
