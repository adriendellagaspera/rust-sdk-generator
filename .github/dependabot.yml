version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directories:
      - /
      - /openapi-to-rust-bindings
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 21
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
