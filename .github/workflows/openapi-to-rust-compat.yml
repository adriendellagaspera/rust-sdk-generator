name: openapi-to-rust compatibility (legacy manifest oracle)

on:
  pull_request:
    paths:
      - ".github/workflows/openapi-to-rust-compat.yml"
      - "openapi-to-rust-bindings/COMPATIBILITY.json"
      - "openapi-to-rust-bindings/scripts/**"
      - "openapi-to-rust-bindings/tests/fixtures/**"
      - "docs/compatibility-migration-157.md"
      - "openapi-to-rust-bindings/src/**"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: openapi-to-rust branch, tag, or commit to resolve immutably
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: openapi-to-rust-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: legacy-manifest-oracle-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGE_ROOT: openapi-to-rust-bindings
      CANDIDATE_REF: ${{ github.event.inputs.candidate_ref || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read immutable tracker baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              (Path(os.environ["PACKAGE_ROOT"]) / "COMPATIBILITY.json").read_text()
          )
          backend = config["backend"]
          baseline = backend["baseline"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"BACKEND_REPOSITORY={backend['repository']}", file=env)
              print(f"BASELINE_COMMIT={baseline['commit']}", file=env)
          PY

      - name: Resolve baseline and candidate commits with an exact verified pin
        shell: bash
        run: |
          set -euo pipefail
          acquire=openapi-to-rust-bindings/scripts/acquire_backend.py
          python3 "$acquire" \
            --repository "$BACKEND_REPOSITORY" --ref "$BASELINE_COMMIT" \
            --expected-sha "$BASELINE_COMMIT" \
            --destination "$RUNNER_TEMP/baseline-source"
          candidate_commit="$(python3 "$acquire" \
            --repository "$BACKEND_REPOSITORY" --ref "$CANDIDATE_REF" \
            --destination "$RUNNER_TEMP/candidate-source")"
          echo "CANDIDATE_COMMIT=$candidate_commit" >> "$GITHUB_ENV"

      - name: Build standalone bindings adapter
        run: cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings

      - name: Build immutable generator revisions
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/baseline-target" \
            cargo build --locked --release \
            --manifest-path "${RUNNER_TEMP}/baseline-source/Cargo.toml" \
            --bin openapi-to-rust
          CARGO_TARGET_DIR="${RUNNER_TEMP}/candidate-target" \
            cargo build --locked --release \
            --manifest-path "${RUNNER_TEMP}/candidate-source/Cargo.toml" \
            --bin openapi-to-rust

      - name: Compare canonical Bindings
        shell: bash
        run: |
          set +e
          python3 openapi-to-rust-bindings/scripts/check_backend_compat.py \
            --package-root openapi-to-rust-bindings \
            --bindings-adapter target/debug/openapi-to-rust-bindings \
            --baseline-generator "${RUNNER_TEMP}/baseline-target/release/openapi-to-rust" \
            --candidate-generator "${RUNNER_TEMP}/candidate-target/release/openapi-to-rust" \
            --candidate-commit "${CANDIDATE_COMMIT}" \
            --report "${RUNNER_TEMP}/compatibility-report.md" \
            --report-json "${RUNNER_TEMP}/compatibility-report.json" \
            --update-data "${RUNNER_TEMP}/pin-update.json"
          status=$?
          set -e

          if test -f "${RUNNER_TEMP}/compatibility-report.md"; then
            cat "${RUNNER_TEMP}/compatibility-report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if test -f "${RUNNER_TEMP}/compatibility-report.json"; then
            {
              echo
              echo "## Machine-readable stage and provenance report"
              echo
              echo '~~~json'
              cat "${RUNNER_TEMP}/compatibility-report.json"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if test -f "${RUNNER_TEMP}/pin-update.json"; then
            {
              echo
              echo "## Reproducible pin update data"
              echo
              echo '~~~json'
              cat "${RUNNER_TEMP}/pin-update.json"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          {
            echo
            echo "## Reproduce this exact legacy oracle comparison"
            echo
            echo "gh workflow run openapi-to-rust-compat.yml -f candidate_ref=${CANDIDATE_COMMIT}"
            echo
            echo "This runner still requires producer manifests. Fork main after #18 is not a manifest-capable candidate; its failure is recorded, not hidden."
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
