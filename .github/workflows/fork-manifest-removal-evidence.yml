name: Fork manifest-removal evidence

on:
  pull_request:
    paths:
      - ".github/workflows/fork-manifest-removal-evidence.yml"
      - "openapi-to-rust-bindings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-manifest-removal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: raw-output-and-manifest-free-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build adapter and SDK generator
        run: |
          cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
          cargo build --locked -p rust-sdk-generator --bin rust-sdk-generator

      - name: Checkout immutable fork before and after manifest removal
        shell: bash
        run: |
          set -euo pipefail
          before=9fee7af67c05d896da86e41d326b067312120c53
          after=da04024b50144b8d15efb632c8b51a2bc884eac2
          for pair in "before:$before" "after:$after"; do
            name="${pair%%:*}"
            sha="${pair#*:}"
            dir="$RUNNER_TEMP/openapi-$name"
            git init "$dir"
            git -C "$dir" remote add origin https://github.com/adriendellagaspera/openapi-to-rust.git
            git -C "$dir" fetch --depth=1 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          done

      - name: Build both exact fork revisions
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/before-target" cargo build --locked             --manifest-path "$RUNNER_TEMP/openapi-before/Cargo.toml" --bin openapi-to-rust
          CARGO_TARGET_DIR="$RUNNER_TEMP/after-target" cargo build --locked             --manifest-path "$RUNNER_TEMP/openapi-after/Cargo.toml" --bin openapi-to-rust

      - name: Generate representative raw output before and after removal
        shell: bash
        run: |
          set -euo pipefail
          cp -R openapi-to-rust-bindings/tests/fixtures/fork-semantic "$RUNNER_TEMP/before-fixture"
          cp -R openapi-to-rust-bindings/tests/fixtures/fork-semantic "$RUNNER_TEMP/after-fixture"
          (
            cd "$RUNNER_TEMP/before-fixture"
            "$RUNNER_TEMP/before-target/debug/openapi-to-rust" generate --config compat.toml
          )
          sed -i '/^binding_manifest = true$/d' "$RUNNER_TEMP/after-fixture/compat.toml"
          (
            cd "$RUNNER_TEMP/after-fixture"
            "$RUNNER_TEMP/after-target/debug/openapi-to-rust" generate --config compat.toml
          )

          test -f "$RUNNER_TEMP/before-fixture/raw/binding-manifest.json"
          test ! -e "$RUNNER_TEMP/after-fixture/raw/binding-manifest.json"
          for file in client.rs types.rs mod.rs REQUIRED_DEPS.toml; do
            diff -u "$RUNNER_TEMP/before-fixture/raw/$file" "$RUNNER_TEMP/after-fixture/raw/$file"
          done
          echo "Manifest removal leaves representative ordinary Rust byte-for-byte unchanged."

      - name: Compare old manifest oracle with post-removal manifest-free extraction
        shell: bash
        run: |
          set -euo pipefail
          target/debug/openapi-to-rust-bindings             "$RUNNER_TEMP/before-fixture/raw" > "$RUNNER_TEMP/before-bindings.json"
          target/debug/openapi-to-rust-bindings             --extract "$RUNNER_TEMP/after-fixture/raw" "$RUNNER_TEMP/after-fixture/openapi.json"             > "$RUNNER_TEMP/after-bindings.json"

          python3 - "$RUNNER_TEMP/before-bindings.json" "$RUNNER_TEMP/after-bindings.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          before = json.loads(Path(sys.argv[1]).read_text())
          after = json.loads(Path(sys.argv[2]).read_text())

          def canonical_type(value):
              return re.sub(r",(?=>)", "", re.sub(r"\s+", "", value))

          for bindings in (before, after):
              for operation in bindings["operations"].values():
                  operation["return_type"] = canonical_type(operation["return_type"])
                  abi = operation["metadata"]["stream_abi"]
                  if abi is not None:
                      for target in ("native_type", "wasm_type"):
                          abi[target] = canonical_type(abi[target])

          assert before == after
          operations = after["operations"].values()
          assert any(op["metadata"]["kind"] == "multipart_filenames" for op in operations)
          operations = after["operations"].values()
          assert any(op["metadata"]["representation"]["kind"] == "event_stream" for op in operations)
          operations = after["operations"].values()
          assert any(op["metadata"]["representation"]["kind"] == "binary_stream" for op in operations)
          operations = after["operations"].values()
          assert any(op["metadata"]["request_discriminators"] for op in operations)
          print("Pre-removal manifest oracle == post-removal manifest-free Bindings v3.")
          PY

      - name: Derive, generate and compile facade from post-removal fork
        shell: bash
        run: |
          set -euo pipefail
          spec="$RUNNER_TEMP/after-fixture/openapi.json"
          raw="$RUNNER_TEMP/after-fixture/raw"
          bindings="$RUNNER_TEMP/after-bindings.json"
          definition="$RUNNER_TEMP/fork-definition.json"
          sdk="$RUNNER_TEMP/fork-sdk"
          consumer="$RUNNER_TEMP/fork-consumer"

          target/debug/rust-sdk-generator derive             --openapi "$spec" --bindings "$bindings"             --definition-output "$definition" > "$RUNNER_TEMP/fork-derivation.json"
          target/debug/rust-sdk-generator generate             --openapi "$spec" --bindings "$bindings"             --definition "$definition" --output "$sdk" > "$RUNNER_TEMP/fork-inventory.json"

          mkdir -p "$consumer/src/generated" "$consumer/src/sdk"
          cp "$raw"/*.rs "$consumer/src/generated/"
          cp "$sdk"/*.rs "$consumer/src/sdk/"
          cp examples/independent-sdk/consumer/src/sdk/error.rs "$consumer/src/sdk/error.rs"
          cat > "$consumer/src/lib.rs" <<'RS'
          pub mod generated;
          pub mod sdk;
          RS
          {
            echo '[package]'
            echo 'name = "post-manifest-fork-sdk-proof"'
            echo 'version = "0.0.0"'
            echo 'edition = "2024"'
            echo 'publish = false'
            echo ''
            echo '[workspace]'
            echo ''
            cat "$raw/REQUIRED_DEPS.toml"
          } > "$consumer/Cargo.toml"
          cargo check --manifest-path "$consumer/Cargo.toml" --all-targets
