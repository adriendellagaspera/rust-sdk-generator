name: Upstream structural evidence

on:
  pull_request:
    paths:
      - ".github/workflows/upstream-structural-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-structural-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-structural-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: upstream-only-structural
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Rust evidence inspector and run unit regressions
        run: |
          cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
          cargo test --locked -p openapi-to-rust-bindings --test structural
      - name: Checkout immutable, unmodified upstream
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/openapi-upstream"
          git -C "$RUNNER_TEMP/openapi-upstream" remote add origin https://github.com/gpu-cli/openapi-to-rust.git
          git -C "$RUNNER_TEMP/openapi-upstream" fetch --depth=1 origin 5a3487edbe27cfd4efb32dda893774e23d7fa195
          git -C "$RUNNER_TEMP/openapi-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/openapi-upstream" rev-parse HEAD)" = 5a3487edbe27cfd4efb32dda893774e23d7fa195
      - name: Build exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/upstream-target" \
            cargo build --locked \
            --manifest-path "$RUNNER_TEMP/openapi-upstream/Cargo.toml" \
            --bin openapi-to-rust
      - name: Generate ordinary Rust and inspect only actual output
        shell: bash
        run: |
          set -euo pipefail
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/upstream-structural/openapi.json"
          output="$RUNNER_TEMP/upstream-output"
          "$RUNNER_TEMP/upstream-target/debug/openapi-to-rust" generate "$spec" \
            --output-dir "$output" --module-name structural --quiet
          test -f "$output/client.rs"
          test -f "$output/types.rs"
          test ! -e "$output/binding-manifest.json"
          target/debug/openapi-to-rust-bindings --inspect "$output" > "$RUNNER_TEMP/structural-evidence.json"
          python3 - "$RUNNER_TEMP/structural-evidence.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          evidence = json.loads(Path(sys.argv[1]).read_text())
          assert evidence["client"]["path"] == "crate::generated::client::HttpClient"
          names = {method["name"] for method in evidence["client"]["methods"]}
          assert {"fetch_inventory_without_naming_shortcut", "render_inventory", "watch_inventory_events"} <= names, names
          assert "crate::generated::types::Inventory" in evidence["structs"]
          assert "UNPROVEN" in evidence["semantics"]
          print("Manifest-free upstream structural evidence: verified models and three public call signatures.")
          PY
