name: Materialize issue 7 bindings
on:
  push:
    branches: [issue-7-bootstrap-bindings]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-7-bootstrap-bindings
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Import current openapi-to-rust-bindings package
        shell: bash
        env:
          GENERATOR_COMMIT: fdd9901f24095761e8daf6a83ee2e5de63da8ddf
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          git clone --depth=1 --branch openapi-to-rust-bindings https://github.com/adriendellagaspera/mistralai-rs.git "$source_dir"
          source_sha="$(git -C "$source_dir" rev-parse HEAD)"
          rm -rf openapi-to-rust-bindings
          mkdir -p openapi-to-rust-bindings
          cp -R "$source_dir/src" openapi-to-rust-bindings/src
          cp -R "$source_dir/tests" openapi-to-rust-bindings/tests
          cp -R "$source_dir/scripts" openapi-to-rust-bindings/scripts
          cp "$source_dir/README.md" openapi-to-rust-bindings/README.md
          cp "$source_dir/COMPATIBILITY.json" openapi-to-rust-bindings/COMPATIBILITY.json
          cp "$source_dir/LICENSE-MIT" openapi-to-rust-bindings/LICENSE-MIT
          cp "$source_dir/LICENSE-APACHE" openapi-to-rust-bindings/LICENSE-APACHE
          python - <<'PY'
          from pathlib import Path
          import json, os, tomllib

          root = Path('openapi-to-rust-bindings')
          generator_commit = os.environ['GENERATOR_COMMIT']
          for path in [*root.joinpath('src').rglob('*.py'), *root.joinpath('tests').rglob('*.py')]:
              text = path.read_text().replace('rust_sdk_compiler', 'rust_sdk_generator')
              text = text.replace('rust-sdk-compiler', 'rust-sdk-generator')
              text = text.replace('https://github.com/adriendellagaspera/mistralai-rs.git@8357b0e487bd06898099f687c9918a0c5db02db4', f'https://github.com/adriendellagaspera/rust-sdk-generator.git@{generator_commit}')
              text = text.replace('8357b0e487bd06898099f687c9918a0c5db02db4', generator_commit)
              path.write_text(text)
          readme = root / 'README.md'
          readme.write_text(readme.read_text().replace('rust-sdk-compiler', 'rust-sdk-generator'))
          compatibility_path = root / 'COMPATIBILITY.json'
          compatibility = json.loads(compatibility_path.read_text())
          compatibility['compiler']['name'] = 'rust-sdk-generator'
          compatibility['compiler']['commit'] = generator_commit
          compatibility_path.write_text(json.dumps(compatibility, indent=2) + '\n')
          source_project = tomllib.loads(Path(os.environ.get('SOURCE_PYPROJECT', '/dev/null')).read_text()) if False else None
          PY
          cat > openapi-to-rust-bindings/pyproject.toml <<EOF
          [build-system]
          requires = ["setuptools==75.8.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "openapi-to-rust-bindings"
          version = "0.2.2"
          description = "Load openapi-to-rust binding metadata into rust-sdk-generator Bindings"
          readme = "README.md"
          requires-python = ">=3.11"
          license = {text = "MIT OR Apache-2.0"}
          dependencies = [
            "rust-sdk-generator @ git+https://github.com/adriendellagaspera/rust-sdk-generator.git@${GENERATOR_COMMIT}",
            "tree-sitter==0.25.2",
            "tree-sitter-rust==0.24.0",
          ]

          [tool.setuptools]
          package-dir = {"" = "src"}
          packages = ["openapi_to_rust_bindings"]
          EOF
          cd openapi-to-rust-bindings
          uv lock
          uv build --wheel
          uv venv .test-venv --python 3.11
          uv pip install --python .test-venv/bin/python dist/*.whl
          .test-venv/bin/python -m unittest discover -s tests -p 'test_*.py'
          rm -rf dist .test-venv build
          find src tests -type d -name '__pycache__' -prune -exec rm -rf {} +
          find src -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          cd ..
          printf '%s\n' "$source_sha" > .bootstrap-bindings-source-commit
      - name: Commit imported bindings component
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat .bootstrap-bindings-source-commit)"
          rm .bootstrap-bindings-source-commit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add openapi-to-rust-bindings
          git commit -m "feat: bootstrap openapi-to-rust-bindings" -m "Imported generic behavior from mistralai-rs openapi-to-rust-bindings ${source_sha}."
          git push origin HEAD:issue-7-bootstrap-bindings
