name: Upstream semantic evidence

on:
  pull_request:
    paths:
      - ".github/workflows/upstream-semantic-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-semantic-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: upstream-only-semantic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build semantic extractor and run focused regressions
        run: |
          cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
          cargo test --locked -p openapi-to-rust-bindings --test semantic

      - name: Checkout immutable unmodified upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=5a3487edbe27cfd4efb32dda893774e23d7fa195
          git init "$RUNNER_TEMP/openapi-upstream"
          git -C "$RUNNER_TEMP/openapi-upstream" remote add origin https://github.com/gpu-cli/openapi-to-rust.git
          git -C "$RUNNER_TEMP/openapi-upstream" fetch --depth=1 origin "$upstream_sha"
          git -C "$RUNNER_TEMP/openapi-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/openapi-upstream" rev-parse HEAD)" = "$upstream_sha"

      - name: Build exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/upstream-target" \
            cargo build --locked \
            --manifest-path "$RUNNER_TEMP/openapi-upstream/Cargo.toml" \
            --bin openapi-to-rust

      - name: Generate ordinary Rust and prove canonical semantics
        shell: bash
        run: |
          set -euo pipefail
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/upstream-semantic/openapi.json"
          output="$RUNNER_TEMP/upstream-semantic-output"
          "$RUNNER_TEMP/upstream-target/debug/openapi-to-rust" generate "$spec" \
            --output-dir "$output" --module-name semantic --quiet
          test -f "$output/client.rs"
          test -f "$output/types.rs"
          test ! -e "$output/binding-manifest.json"

          target/debug/openapi-to-rust-bindings \
            --inspect-semantics "$output" "$spec" > "$RUNNER_TEMP/semantic.json"
          target/debug/openapi-to-rust-bindings \
            --extract "$output" "$spec" > "$RUNNER_TEMP/bindings.json"

          python3 - "$RUNNER_TEMP/semantic.json" "$RUNNER_TEMP/bindings.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          semantic = json.loads(Path(sys.argv[1]).read_text())
          bindings = json.loads(Path(sys.argv[2]).read_text())

          assert semantic["unsupported_stream_methods"] == []
          assert semantic["unmatched_source_operations"] == []
          assert set(semantic["operations"]) == {
              "delete_inventory",
              "fetch_inventory_without_naming_shortcut",
              "render_inventory",
          }
          assert semantic["operations"]["render_inventory"]["representation"]["kind"] == "json"
          assert semantic["operations"]["fetch_inventory_without_naming_shortcut"]["success_statuses"] == ["200"]
          assert semantic["operations"]["render_inventory"]["success_statuses"] == ["200"]
          assert semantic["operations"]["delete_inventory"]["success_statuses"] == ["204"]

          assert bindings["schema_version"] == 3
          assert set(bindings["operations"]) == set(semantic["operations"])
          assert bindings["operations"]["render_inventory"]["metadata"]["representation"]["kind"] == "json"
          assert bindings["operations"]["fetch_inventory_without_naming_shortcut"]["metadata"]["source_operation"] == {
              "operation_id": "fetchInventoryWithoutNamingShortcut",
              "method": "GET",
              "path": "/inventory/{id}",
          }
          assert bindings["symbol_paths"]["Inventory"] == "crate::generated::types::Inventory"
          print("Manifest-free upstream semantics -> canonical Bindings v3: verified.")
          PY
