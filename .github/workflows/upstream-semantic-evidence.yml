name: Upstream semantic evidence

on:
  pull_request:
    paths:
      - ".github/workflows/upstream-semantic-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-semantic-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: upstream-only-semantic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build semantic extractor and run focused regressions
        run: |
          cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
          cargo build --locked -p rust-sdk-generator --bin rust-sdk-generator
          cargo test --locked -p openapi-to-rust-bindings --test semantic

      - name: Checkout immutable unmodified upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=5a3487edbe27cfd4efb32dda893774e23d7fa195
          git init "$RUNNER_TEMP/openapi-upstream"
          git -C "$RUNNER_TEMP/openapi-upstream" remote add origin https://github.com/gpu-cli/openapi-to-rust.git
          git -C "$RUNNER_TEMP/openapi-upstream" fetch --depth=1 origin "$upstream_sha"
          git -C "$RUNNER_TEMP/openapi-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/openapi-upstream" rev-parse HEAD)" = "$upstream_sha"

      - name: Build exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/upstream-target" \
            cargo build --locked \
            --manifest-path "$RUNNER_TEMP/openapi-upstream/Cargo.toml" \
            --bin openapi-to-rust

      - name: Generate ordinary Rust and prove canonical semantics
        shell: bash
        run: |
          set -euo pipefail
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/upstream-semantic/openapi.json"
          output="$RUNNER_TEMP/upstream-semantic-output"
          "$RUNNER_TEMP/upstream-target/debug/openapi-to-rust" generate "$spec" \
            --output-dir "$output" --module-name semantic --quiet
          test -f "$output/client.rs"
          test -f "$output/types.rs"
          test ! -e "$output/binding-manifest.json"

          target/debug/openapi-to-rust-bindings \
            --inspect-semantics "$output" "$spec" > "$RUNNER_TEMP/semantic.json"
          target/debug/openapi-to-rust-bindings \
            --extract "$output" "$spec" > "$RUNNER_TEMP/bindings.json"

          python3 - "$RUNNER_TEMP/semantic.json" "$RUNNER_TEMP/bindings.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          semantic = json.loads(Path(sys.argv[1]).read_text())
          bindings = json.loads(Path(sys.argv[2]).read_text())

          assert semantic["unsupported_stream_methods"] == []
          assert semantic["unmatched_source_operations"] == []
          assert set(semantic["operations"]) == {
              "delete_inventory",
              "fetch_inventory_without_naming_shortcut",
              "render_inventory",
          }
          assert semantic["operations"]["render_inventory"]["representation"]["kind"] == "json"
          assert semantic["operations"]["fetch_inventory_without_naming_shortcut"]["success_statuses"] == ["200"]
          assert semantic["operations"]["render_inventory"]["success_statuses"] == ["200"]
          assert semantic["operations"]["delete_inventory"]["success_statuses"] == ["204"]

          assert bindings["schema_version"] == 3
          assert set(bindings["operations"]) == set(semantic["operations"])
          assert bindings["operations"]["render_inventory"]["metadata"]["representation"]["kind"] == "json"
          assert bindings["operations"]["fetch_inventory_without_naming_shortcut"]["metadata"]["source_operation"] == {
              "operation_id": "fetchInventoryWithoutNamingShortcut",
              "method": "GET",
              "path": "/inventory/{id}",
          }
          assert bindings["symbol_paths"]["Inventory"] == "crate::generated::types::Inventory"
          print("Manifest-free upstream semantics -> canonical Bindings v3: verified.")
          PY

      - name: Compile standalone facade from unmodified upstream
        shell: bash
        run: |
          set -euo pipefail
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/upstream-semantic/openapi.json"
          raw="$RUNNER_TEMP/upstream-semantic-output"
          bindings="$RUNNER_TEMP/bindings.json"
          definition="$RUNNER_TEMP/upstream-definition.json"
          sdk="$RUNNER_TEMP/upstream-sdk"
          consumer="$RUNNER_TEMP/upstream-consumer"

          target/debug/rust-sdk-generator derive \
            --openapi "$spec" \
            --bindings "$bindings" \
            --definition-output "$definition" \
            > "$RUNNER_TEMP/upstream-derivation.json"
          target/debug/rust-sdk-generator generate \
            --openapi "$spec" \
            --bindings "$bindings" \
            --definition "$definition" \
            --output "$sdk" \
            > "$RUNNER_TEMP/upstream-inventory.json"

          mkdir -p "$consumer/src/generated" "$consumer/src/sdk"
          cp "$raw"/*.rs "$consumer/src/generated/"
          cp "$sdk"/*.rs "$consumer/src/sdk/"
          cp examples/independent-sdk/consumer/src/sdk/error.rs "$consumer/src/sdk/error.rs"
          cat > "$consumer/src/lib.rs" <<'RS'
          pub mod generated;
          pub mod sdk;
          RS
          {
            echo '[package]'
            echo 'name = "unmodified-upstream-sdk-proof"'
            echo 'version = "0.0.0"'
            echo 'edition = "2024"'
            echo 'publish = false'
            echo ''
            echo '[workspace]'
            echo ''
            cat "$raw/REQUIRED_DEPS.toml"
          } > "$consumer/Cargo.toml"

          cargo check --manifest-path "$consumer/Cargo.toml" --all-targets
          echo "Unmodified upstream -> Bindings v3 -> generated standalone facade: compiled."

      - name: Checkout immutable fork oracle
        shell: bash
        run: |
          set -euo pipefail
          fork_sha=9fee7af67c05d896da86e41d326b067312120c53
          git init "$RUNNER_TEMP/openapi-fork"
          git -C "$RUNNER_TEMP/openapi-fork" remote add origin https://github.com/adriendellagaspera/openapi-to-rust.git
          git -C "$RUNNER_TEMP/openapi-fork" fetch --depth=1 origin "$fork_sha"
          git -C "$RUNNER_TEMP/openapi-fork" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/openapi-fork" rev-parse HEAD)" = "$fork_sha"

      - name: Build exact fork oracle
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/fork-target" \
            cargo build --locked \
            --manifest-path "$RUNNER_TEMP/openapi-fork/Cargo.toml" \
            --bin openapi-to-rust

      - name: Compare manifest-free extraction with fresh fork manifest
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fork-semantic"
          cp -R "$PWD/openapi-to-rust-bindings/tests/fixtures/fork-semantic" "$fixture"
          (
            cd "$fixture"
            "$RUNNER_TEMP/fork-target/debug/openapi-to-rust" generate --config compat.toml
          )
          test -f "$fixture/raw/client.rs"
          test -f "$fixture/raw/types.rs"
          test -f "$fixture/raw/binding-manifest.json"

          target/debug/openapi-to-rust-bindings "$fixture/raw" > "$RUNNER_TEMP/manifest-bindings.json"
          target/debug/openapi-to-rust-bindings \
            --extract "$fixture/raw" "$fixture/openapi.json" > "$RUNNER_TEMP/extracted-bindings.json"

          python3 - "$RUNNER_TEMP/manifest-bindings.json" "$RUNNER_TEMP/extracted-bindings.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text())
          extracted = json.loads(Path(sys.argv[2]).read_text())

          if manifest != extracted:
              keys = sorted(set(manifest) | set(extracted))
              changed = [key for key in keys if manifest.get(key) != extracted.get(key)]
              raise AssertionError(f"manifest-free canonical mismatch in sections: {changed}")

          operations = extracted["operations"]
          assert any(
              operation["metadata"]["kind"] == "multipart_filenames"
              for operation in operations.values()
          )
          assert any(
              operation["metadata"]["representation"]["kind"] == "event_stream"
              and operation["metadata"]["stream_abi"] is not None
              for operation in operations.values()
          )
          assert any(
              operation["metadata"]["representation"]["kind"] == "binary_stream"
              and operation["metadata"]["stream_abi"] is not None
              for operation in operations.values()
          )
          render = [
              operation for operation in operations.values()
              if operation["metadata"]["source_operation"]["operation_id"] == "render"
          ]
          assert any(operation["metadata"]["request_discriminators"] for operation in render)
          print("Fresh fork manifest == manifest-free canonical Bindings v3: verified.")
          PY

  manifest-free-sdk:
    name: manifest-free-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, derive, compile and HTTP-test without producer manifest
        shell: bash
        run: |
          cargo run --locked --example independent-sdk-quickstart -- \
            --manifest-free \
            --work-dir "$RUNNER_TEMP/manifest-free-sdk"
