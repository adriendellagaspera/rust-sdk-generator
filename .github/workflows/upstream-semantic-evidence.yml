name: Upstream semantic evidence

on:
  pull_request:
    paths:
      - ".github/workflows/upstream-semantic-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-semantic-evidence.yml"
      - "Cargo.lock"
      - "openapi-to-rust-bindings/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: upstream-only-semantic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build semantic extractor and run focused regressions
        run: |
          cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
          cargo build --locked -p rust-sdk-generator --bin rust-sdk-generator
          cargo test --locked -p openapi-to-rust-bindings --test semantic

      - name: Checkout immutable unmodified upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=5a3487edbe27cfd4efb32dda893774e23d7fa195
          git init "$RUNNER_TEMP/openapi-upstream"
          git -C "$RUNNER_TEMP/openapi-upstream" remote add origin https://github.com/gpu-cli/openapi-to-rust.git
          git -C "$RUNNER_TEMP/openapi-upstream" fetch --depth=1 origin "$upstream_sha"
          git -C "$RUNNER_TEMP/openapi-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/openapi-upstream" rev-parse HEAD)" = "$upstream_sha"

      - name: Build exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/upstream-target" \
            cargo build --locked \
            --manifest-path "$RUNNER_TEMP/openapi-upstream/Cargo.toml" \
            --bin openapi-to-rust

      - name: Generate ordinary Rust and prove canonical semantics
        shell: bash
        run: |
          set -euo pipefail
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/upstream-semantic/openapi.json"
          output="$RUNNER_TEMP/upstream-semantic-output"
          "$RUNNER_TEMP/upstream-target/debug/openapi-to-rust" generate "$spec" \
            --output-dir "$output" --module-name semantic --quiet
          test -f "$output/client.rs"
          test -f "$output/types.rs"
          test ! -e "$output/binding-manifest.json"

          target/debug/openapi-to-rust-bindings \
            --inspect-semantics "$output" "$spec" > "$RUNNER_TEMP/semantic.json"
          target/debug/openapi-to-rust-bindings \
            --extract "$output" "$spec" > "$RUNNER_TEMP/bindings.json"

          python3 - "$RUNNER_TEMP/semantic.json" "$RUNNER_TEMP/bindings.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          semantic = json.loads(Path(sys.argv[1]).read_text())
          bindings = json.loads(Path(sys.argv[2]).read_text())

          assert semantic["unsupported_stream_methods"] == []
          assert semantic["unmatched_source_operations"] == []
          assert set(semantic["operations"]) == {
              "delete_inventory",
              "fetch_inventory_without_naming_shortcut",
              "render_inventory",
          }
          assert semantic["operations"]["render_inventory"]["representation"]["kind"] == "json"
          assert semantic["operations"]["fetch_inventory_without_naming_shortcut"]["success_statuses"] == ["200"]
          assert semantic["operations"]["render_inventory"]["success_statuses"] == ["200"]
          assert semantic["operations"]["delete_inventory"]["success_statuses"] == ["204"]

          assert bindings["schema_version"] == 3
          assert set(bindings["operations"]) == set(semantic["operations"])
          assert bindings["operations"]["render_inventory"]["metadata"]["representation"]["kind"] == "json"
          assert bindings["operations"]["fetch_inventory_without_naming_shortcut"]["metadata"]["source_operation"] == {
              "operation_id": "fetchInventoryWithoutNamingShortcut",
              "method": "GET",
              "path": "/inventory/{id}",
          }
          assert bindings["symbol_paths"]["Inventory"] == "crate::generated::types::Inventory"
          print("Manifest-free upstream semantics -> canonical Bindings v3: verified.")
          PY

      - name: Compile standalone facade from unmodified upstream
        shell: bash
        run: |
          set -euo pipefail
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/upstream-semantic/openapi.json"
          raw="$RUNNER_TEMP/upstream-semantic-output"
          bindings="$RUNNER_TEMP/bindings.json"
          definition="$RUNNER_TEMP/upstream-definition.json"
          sdk="$RUNNER_TEMP/upstream-sdk"
          consumer="$RUNNER_TEMP/upstream-consumer"

          target/debug/rust-sdk-generator derive \
            --openapi "$spec" \
            --bindings "$bindings" \
            --definition-output "$definition" \
            > "$RUNNER_TEMP/upstream-derivation.json"
          target/debug/rust-sdk-generator generate \
            --openapi "$spec" \
            --bindings "$bindings" \
            --definition "$definition" \
            --output "$sdk" \
            > "$RUNNER_TEMP/upstream-inventory.json"

          mkdir -p "$consumer/src/generated" "$consumer/src/sdk"
          cp "$raw"/*.rs "$consumer/src/generated/"
          cp "$sdk"/*.rs "$consumer/src/sdk/"
          cp examples/independent-sdk/consumer/src/sdk/error.rs "$consumer/src/sdk/error.rs"
          cat > "$consumer/src/lib.rs" <<'RS'
          pub mod generated;
          pub mod sdk;
          RS
          {
            echo '[package]'
            echo 'name = "unmodified-upstream-sdk-proof"'
            echo 'version = "0.0.0"'
            echo 'edition = "2024"'
            echo 'publish = false'
            echo ''
            echo '[workspace]'
            echo ''
            cat "$raw/REQUIRED_DEPS.toml"
          } > "$consumer/Cargo.toml"

          cargo check --manifest-path "$consumer/Cargo.toml" --all-targets
          echo "Unmodified upstream -> Bindings v3 -> generated standalone facade: compiled."

      - name: Checkout immutable fork oracle
        shell: bash
        run: |
          set -euo pipefail
          fork_sha=9fee7af67c05d896da86e41d326b067312120c53
          git init "$RUNNER_TEMP/openapi-fork"
          git -C "$RUNNER_TEMP/openapi-fork" remote add origin https://github.com/adriendellagaspera/openapi-to-rust.git
          git -C "$RUNNER_TEMP/openapi-fork" fetch --depth=1 origin "$fork_sha"
          git -C "$RUNNER_TEMP/openapi-fork" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/openapi-fork" rev-parse HEAD)" = "$fork_sha"

      - name: Build exact fork oracle
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/fork-target" \
            cargo build --locked \
            --manifest-path "$RUNNER_TEMP/openapi-fork/Cargo.toml" \
            --bin openapi-to-rust

      - name: Compare manifest-free extraction with fresh fork manifest
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fork-semantic"
          cp -R "$PWD/openapi-to-rust-bindings/tests/fixtures/fork-semantic" "$fixture"
          (
            cd "$fixture"
            "$RUNNER_TEMP/fork-target/debug/openapi-to-rust" generate --config compat.toml
          )
          test -f "$fixture/raw/client.rs"
          test -f "$fixture/raw/types.rs"
          test -f "$fixture/raw/binding-manifest.json"

          target/debug/openapi-to-rust-bindings "$fixture/raw" > "$RUNNER_TEMP/manifest-bindings.json"
          target/debug/openapi-to-rust-bindings \
            --extract "$fixture/raw" "$fixture/openapi.json" > "$RUNNER_TEMP/extracted-bindings.json"

          python3 - "$RUNNER_TEMP/manifest-bindings.json" "$RUNNER_TEMP/extracted-bindings.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text())
          extracted = json.loads(Path(sys.argv[2]).read_text())

          # The producer retains pretty-printed Rust signatures; syn renders
          # equivalent token spellings and may retain a trailing generic comma.
          # Normalize *only* these Rust type spellings; all other Bindings
          # fields, including the stream item/error/lifetime, stay exact.
          def canonical_type(value):
              return re.sub(r",(?=>)", "", re.sub(r"\s+", "", value))

          for bindings in (manifest, extracted):
              for operation in bindings["operations"].values():
                  operation["return_type"] = canonical_type(operation["return_type"])
                  abi = operation["metadata"]["stream_abi"]
                  if abi is not None:
                      for target in ("native_type", "wasm_type"):
                          abi[target] = canonical_type(abi[target])

          if manifest != extracted:
              def differences(left, right, path="$"):
                  if left == right:
                      return []
                  if isinstance(left, dict) and isinstance(right, dict):
                      return [
                          difference
                          for key in sorted(left.keys() | right.keys())
                          for difference in differences(
                              left.get(key, "<absent>"), right.get(key, "<absent>"),
                              f"{path}.{key}",
                          )
                      ]
                  if isinstance(left, list) and isinstance(right, list):
                      if len(left) == len(right):
                          return [
                              difference
                              for index, (a, b) in enumerate(zip(left, right))
                              for difference in differences(a, b, f"{path}[{index}]")
                          ]
                  return [f"{path}: manifest={left!r}, extracted={right!r}"]
              raise AssertionError(
                  "manifest-free canonical mismatch:\n"
                  + "\n".join(differences(manifest, extracted)[:40])
              )

          operations = extracted["operations"]
          assert any(
              operation["metadata"]["kind"] == "multipart_filenames"
              for operation in operations.values()
          )
          assert any(
              operation["metadata"]["representation"]["kind"] == "event_stream"
              and operation["metadata"]["stream_abi"] is not None
              for operation in operations.values()
          )
          assert any(
              operation["metadata"]["representation"]["kind"] == "binary_stream"
              and operation["metadata"]["stream_abi"] is not None
              for operation in operations.values()
          )
          render = [
              operation for operation in operations.values()
              if operation["metadata"]["source_operation"]["operation_id"] == "render"
          ]
          assert any(operation["metadata"]["request_discriminators"] for operation in render)
          print("Fresh fork manifest == manifest-free canonical Bindings v3: verified.")
          PY

      - name: Generate pinned capability-matrix raw outputs
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$PWD/openapi-to-rust-bindings/tests/fixtures/capability-v1"
          upstream_root="$RUNNER_TEMP/capability-upstream"
          fork_root="$RUNNER_TEMP/capability-fork"

          for scenario in core sse discriminator; do
            upstream_fixture="$upstream_root/$scenario"
            mkdir -p "$upstream_fixture"
            cp "$fixture_root/$scenario/openapi.json" "$upstream_fixture/openapi.json"
            cp "$fixture_root/upstream.toml" "$upstream_fixture/config.toml"
            (
              cd "$upstream_fixture"
              "$RUNNER_TEMP/upstream-target/debug/openapi-to-rust" generate --config config.toml
            )
            test -f "$upstream_fixture/raw/client.rs"
            test -f "$upstream_fixture/raw/types.rs"
            test ! -e "$upstream_fixture/raw/binding-manifest.json"

            fork_fixture="$fork_root/$scenario"
            mkdir -p "$fork_fixture"
            cp "$fixture_root/$scenario/openapi.json" "$fork_fixture/openapi.json"
            if test "$scenario" = discriminator; then
              cp "$fixture_root/discriminator/fork.toml" "$fork_fixture/config.toml"
            else
              cp "$fixture_root/fork.toml" "$fork_fixture/config.toml"
            fi
            (
              cd "$fork_fixture"
              "$RUNNER_TEMP/fork-target/debug/openapi-to-rust" generate --config config.toml
            )
            test -f "$fork_fixture/raw/client.rs"
            test -f "$fork_fixture/raw/types.rs"
            test -f "$fork_fixture/raw/binding-manifest.json"
          done

      - name: Prove versioned capability observations
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/capability-report.json"
          cargo run --locked -p openapi-to-rust-bindings --example capability-matrix -- \
            --matrix openapi-to-rust-bindings/capabilities/v1/matrix.json \
            --upstream-root "$RUNNER_TEMP/capability-upstream" \
            --fork-root "$RUNNER_TEMP/capability-fork" \
            --output "$report"
          cat "$report"

      - name: Compile and HTTP-test independent unmodified-upstream capability consumer
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/capability-upstream/core/raw"
          spec="$PWD/openapi-to-rust-bindings/tests/fixtures/capability-v1/core/openapi.json"
          bindings="$RUNNER_TEMP/capability-core-bindings.json"
          definition="$RUNNER_TEMP/capability-core-definition.json"
          sdk="$RUNNER_TEMP/capability-core-sdk"
          consumer="$RUNNER_TEMP/capability-core-consumer"

          test -f "$raw/client.rs"
          test -f "$raw/types.rs"
          test ! -e "$raw/binding-manifest.json"
          target/debug/openapi-to-rust-bindings --extract "$raw" "$spec" > "$bindings"
          for repetition in 1 2 3; do
            target/debug/openapi-to-rust-bindings --extract "$raw" "$spec" \
              > "$RUNNER_TEMP/upstream-capability-bindings-$repetition.json"
            cmp "$bindings" "$RUNNER_TEMP/upstream-capability-bindings-$repetition.json"
          done
          echo "Upstream canonical Bindings v3: three independent-process extractions are byte-identical."
          target/debug/rust-sdk-generator derive \
            --openapi "$spec" --bindings "$bindings" \
            --definition-output "$definition" > "$RUNNER_TEMP/capability-core-derivation.json"
          target/debug/rust-sdk-generator generate \
            --openapi "$spec" --bindings "$bindings" \
            --definition "$definition" --output "$sdk" \
            > "$RUNNER_TEMP/capability-core-inventory.json"

          mkdir -p "$consumer/src/generated" "$consumer/src/sdk" "$consumer/tests"
          cp "$raw"/*.rs "$consumer/src/generated/"
          cp "$sdk"/*.rs "$consumer/src/sdk/"
          cp examples/independent-sdk/consumer/src/sdk/error.rs "$consumer/src/sdk/error.rs"
          cp openapi-to-rust-bindings/tests/fixtures/capability-v1/core/http.rs "$consumer/tests/http.rs"
          printf 'pub mod generated;\npub mod sdk;\n' > "$consumer/src/lib.rs"
          {
            echo '[package]'
            echo 'name = "capability-matrix-consumer"'
            echo 'version = "0.0.0"'
            echo 'edition = "2024"'
            echo 'publish = false'
            echo ''
            echo '[workspace]'
            echo ''
            cat "$raw/REQUIRED_DEPS.toml"
            echo ''
            echo '[dev-dependencies]'
            echo 'tokio = { version = "1", features = ["macros", "rt-multi-thread"] }'
          } > "$consumer/Cargo.toml"

          cargo test --manifest-path "$consumer/Cargo.toml" --all-targets
          echo "Pinned unmodified upstream -> ordinary Rust -> Bindings v3 -> facade -> standalone compile + mock HTTP: verified."

      - name: Compile and HTTP-test fork-only emitted transport variants
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$PWD/openapi-to-rust-bindings/tests/fixtures/capability-v1"
          for scenario in core sse discriminator; do
            raw="$RUNNER_TEMP/capability-fork/$scenario/raw"
            spec="$fixture_root/$scenario/openapi.json"
            bindings="$RUNNER_TEMP/fork-$scenario-bindings.json"
            definition="$RUNNER_TEMP/fork-$scenario-definition.json"
            sdk="$RUNNER_TEMP/fork-$scenario-sdk"
            consumer="$RUNNER_TEMP/fork-$scenario-consumer"

            test -f "$raw/client.rs"
            test -f "$raw/binding-manifest.json"
            target/debug/openapi-to-rust-bindings --extract "$raw" "$spec" > "$bindings"
            for repetition in 1 2 3; do
              target/debug/openapi-to-rust-bindings --extract "$raw" "$spec" \
                > "$RUNNER_TEMP/fork-$scenario-bindings-$repetition.json"
              cmp "$bindings" "$RUNNER_TEMP/fork-$scenario-bindings-$repetition.json"
            done
            echo "Fork $scenario canonical Bindings v3: three independent-process extractions are byte-identical."
            target/debug/rust-sdk-generator derive \
              --openapi "$spec" --bindings "$bindings" \
              --definition-output "$definition" > "$RUNNER_TEMP/fork-$scenario-derivation.json"
            target/debug/rust-sdk-generator generate \
              --openapi "$spec" --bindings "$bindings" \
              --definition "$definition" --output "$sdk" \
              > "$RUNNER_TEMP/fork-$scenario-inventory.json"

            mkdir -p "$consumer/src/generated" "$consumer/src/sdk" "$consumer/tests"
            cp "$raw"/*.rs "$consumer/src/generated/"
            cp "$sdk"/*.rs "$consumer/src/sdk/"
            cp examples/independent-sdk/consumer/src/sdk/error.rs "$consumer/src/sdk/error.rs"
            cp "$fixture_root/$scenario/fork_http.rs" "$consumer/tests/http.rs"
            cp "$fixture_root/fork_http_support.rs" "$consumer/tests/fork_http_support.rs"
            if test "$scenario" = core; then
              cp "$fixture_root/core/http.rs" "$consumer/tests/core_http.rs"
            fi
            printf 'pub mod generated;\npub mod sdk;\n' > "$consumer/src/lib.rs"
            {
              echo '[package]'
              echo 'name = "capability-matrix-consumer"'
              echo 'version = "0.0.0"'
              echo 'edition = "2024"'
              echo 'publish = false'
              echo ''
              echo '[workspace]'
              echo ''
              cat "$raw/REQUIRED_DEPS.toml"
              echo ''
              echo '[dev-dependencies]'
              echo 'futures-util = "0.3"'
              echo 'tokio = { version = "1", features = ["macros", "rt-multi-thread"] }'
            } > "$consumer/Cargo.toml"
            cargo test --manifest-path "$consumer/Cargo.toml" --all-targets
            echo "Fork-only $scenario: manifest-free Bindings v3, standalone native compilation and actual HTTP calls verified."
          done

      - name: Cross-compile fork-only streaming facades for wasm32
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          for scenario in core sse discriminator; do
            consumer="$RUNNER_TEMP/fork-$scenario-consumer"
            CARGO_TARGET_DIR="$RUNNER_TEMP/capability-wasm-target" \
              cargo check --manifest-path "$consumer/Cargo.toml" \
              --target wasm32-unknown-unknown --lib
            echo "Fork-only $scenario: generated stream facade and raw client compiled for wasm32-unknown-unknown."
          done

  manifest-free-sdk:
    name: manifest-free-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, derive, compile and HTTP-test without producer manifest
        shell: bash
        run: |
          cargo run --locked --example independent-sdk-quickstart -- \
            --manifest-free \
            --work-dir "$RUNNER_TEMP/manifest-free-sdk"
