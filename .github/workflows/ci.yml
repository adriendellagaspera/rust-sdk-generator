name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate agent and action-pin contracts
        run: python3 scripts/check_agent_contract.py
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py "$PR_TITLE"
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Check Python proof syntax
        run: python3 -m py_compile examples/independent-sdk/prove.py surface/*.py
      - name: Test Fern surface contract
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m unittest discover -s surface -p "test_*.py"
      - name: Check compatibility fixture and pin helpers
        run: |
          python3 -m unittest discover -s openapi-to-rust-bindings/scripts -p "test_*.py"
          python3 -m py_compile openapi-to-rust-bindings/scripts/*.py
      - name: Reject high-confidence Python defects
        run: >-
          uvx --from ruff==0.16.8 ruff check
          --select E4,E7,E9,F63,F7,F82
          tests/test_bindings_integration.py scripts
          openapi-to-rust-bindings/scripts examples/independent-sdk/prove.py surface

  generator:
    name: generator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust generator
        run: cargo clippy -p rust-sdk-generator --all-targets --all-features -- -D warnings
      - name: Test Rust generator
        run: cargo test -p rust-sdk-generator --all-targets --all-features
      - name: Lint installable orchestrator
        run: cargo clippy -p rust-sdk-cli --all-targets --all-features -- -D warnings
      - name: Test installable orchestrator
        run: cargo test -p rust-sdk-cli --all-targets --all-features
      - name: Enforce backend-neutral dependency direction
        run: |
          test -z "$(grep -R -n -E 'openapi_to_rust_bindings|openapi-to-rust-bindings|import openapi_to_rust' src/*.rs || true)"

  bindings:
    name: bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Rust bindings shim
        run: cargo clippy -p openapi-to-rust-bindings --all-targets --all-features -- -D warnings
      - name: Test Rust bindings shim
        run: cargo test -p openapi-to-rust-bindings --all-targets --all-features

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
      - name: Prove shim rejects legacy metadata inputs
        env:
          OPENAPI_TO_RUST_BINDINGS_BIN: target/debug/openapi-to-rust-bindings
        run: python3 -m unittest tests.test_bindings_integration

  independent-sdk:
    name: independent-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute the documented one-command quickstart
        shell: bash
        run: |
          cargo run --locked --example independent-sdk-quickstart -- \
            --work-dir "${RUNNER_TEMP}/independent-sdk-proof"
      - name: Inspect generated Rust and derivation report
        if: always()
        shell: bash
        run: |
          for file in "${RUNNER_TEMP}"/independent-sdk-proof/first/sdk/*.rs; do
            if test -f "$file"; then
              echo "::group::$(basename "$file")"
              sed -n '1,240p' "$file"
              echo "::endgroup::"
            fi
          done
          if test -f "${RUNNER_TEMP}/independent-sdk-proof/first/derivation.json"; then
            python3 -m json.tool "${RUNNER_TEMP}/independent-sdk-proof/first/derivation.json"
          fi


  own-api-sdk:
    name: own-api-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check published package file lists
        run: |
          cargo package --list --locked -p rust-sdk-generator > "$RUNNER_TEMP/generator-package-files"
          cargo package --list --locked -p openapi-to-rust-bindings > "$RUNNER_TEMP/bindings-package-files"
          cargo package --list --locked -p rust-sdk-cli > "$RUNNER_TEMP/cli-package-files"
          grep -Fx 'DEFAULT_BACKEND.json' "$RUNNER_TEMP/cli-package-files"
          grep -Fx 'templates/standalone-v1/src/lib.rs' "$RUNNER_TEMP/cli-package-files"
          grep -Fx 'templates/standalone-v1/src/sdk/error.rs' "$RUNNER_TEMP/cli-package-files"
          grep -Fx 'src/cli.rs' "$RUNNER_TEMP/generator-package-files"
      - name: Check bundled resources match the canonical sources
        run: |
          cmp rust-sdk-cli/DEFAULT_BACKEND.json openapi-to-rust-bindings/DEFAULT_BACKEND.json
          cmp rust-sdk-cli/templates/standalone-v1/src/lib.rs templates/standalone-v1/src/lib.rs
          cmp rust-sdk-cli/templates/standalone-v1/src/sdk/error.rs templates/standalone-v1/src/sdk/error.rs
      - name: Prove documented local-first own-API init/sync and HTTP
        run: bash scripts/prove_own_api_sdk.sh

  production-compatibility:
    name: production-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read production backend pin
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tracker = json.loads(
              Path("openapi-to-rust-bindings/COMPATIBILITY.json").read_text()
          )
          backend = tracker["backend"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"BACKEND_REPOSITORY={backend['repository']}", file=env)
              print(f"BACKEND_COMMIT={backend['baseline']['commit']}", file=env)
          PY
      - name: Checkout exact production backend
        run: |
          python3 openapi-to-rust-bindings/scripts/acquire_backend.py             --repository "$BACKEND_REPOSITORY"             --ref "$BACKEND_COMMIT"             --expected-sha "$BACKEND_COMMIT"             --destination "$RUNNER_TEMP/production-backend"
      - name: Build production boundary
        shell: bash
        run: |
          cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
          cargo build --locked -p rust-sdk-generator --bin rust-sdk-generator
          CARGO_TARGET_DIR="$RUNNER_TEMP/production-backend-target"             cargo build --locked --release             --manifest-path "$RUNNER_TEMP/production-backend/Cargo.toml"             --bin openapi-to-rust
      - name: Exercise production metadata-backed compatibility gate
        shell: bash
        run: |
          python3 openapi-to-rust-bindings/scripts/check_production_compat.py             --repo-root "$PWD"             --baseline-generator "$RUNNER_TEMP/production-backend-target/release/openapi-to-rust"             --candidate-generator "$RUNNER_TEMP/production-backend-target/release/openapi-to-rust"             --baseline-commit "$BACKEND_COMMIT"             --candidate-commit "$BACKEND_COMMIT"             --adapter target/debug/openapi-to-rust-bindings             --root-generator target/debug/rust-sdk-generator             --report-json "$RUNNER_TEMP/ci-production-compatibility.json"             --report-md "$RUNNER_TEMP/ci-production-compatibility.md"
          cat "$RUNNER_TEMP/ci-production-compatibility.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish CI production compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-production-compatibility
          path: |
            ${{ runner.temp }}/ci-production-compatibility.json
            ${{ runner.temp }}/ci-production-compatibility.md
          if-no-files-found: error
          retention-days: 30


  langgraph-fern:
    name: langgraph-fern
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: langchain-ai/agent-protocol
          ref: fb81f3e27ee507557926ecf923d0f933a1c76d44
          path: .fixtures/agent-protocol
          persist-credentials: false
      - name: Install policy dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Compile LangGraph policy to Fern extensions
        run: |
          python3 surface/sdk_surface.py compile \
            --source .fixtures/agent-protocol/openapi.json \
            --policy fixtures/langgraph/policy.yaml \
            --output fixtures/langgraph/fern/openapi.json \
            --resolution "$RUNNER_TEMP/langgraph-resolution.json"
      - name: Build and verify Fern IR
        run: |
          (
            cd fixtures/langgraph
            npx --yes fern-api@5.112.0 ir fern-ir.json --language rust --disable-examples --from-openapi
          )
          python3 surface/sdk_surface.py verify \
            --source .fixtures/agent-protocol/openapi.json \
            --policy fixtures/langgraph/policy.yaml \
            --fern-ir fixtures/langgraph/fern-ir.json \
            --inventory "$RUNNER_TEMP/langgraph-inventory.json"
          python3 - "$RUNNER_TEMP/langgraph-inventory.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["source_operation_count"] == 27, report
          assert report["published_operation_count"] == 27, report
          assert report["excluded_operation_count"] == 0, report
          assert not any(report["verification"].values()), report["verification"]
          PY
      - name: Generate deterministic LangGraph Rust SDK
        run: |
          (
            cd fixtures/langgraph
            npx --yes fern-api@5.112.0 generate --group rust-sdk --local --no-prompt --force --log-level info
          )
          python3 surface/sdk_surface.py digest \
            --root fixtures/langgraph/generated \
            --output "$RUNNER_TEMP/langgraph-first.json"
          rm -rf fixtures/langgraph/generated
          (
            cd fixtures/langgraph
            npx --yes fern-api@5.112.0 generate --group rust-sdk --local --no-prompt --force --log-level info
          )
          python3 surface/sdk_surface.py digest \
            --root fixtures/langgraph/generated \
            --output "$RUNNER_TEMP/langgraph-second.json"
          cmp "$RUNNER_TEMP/langgraph-first.json" "$RUNNER_TEMP/langgraph-second.json"
      - name: Compile generated SDK and require native SSE surface
        run: |
          cargo fmt --manifest-path fixtures/langgraph/generated/Cargo.toml -- --check
          cargo check --manifest-path fixtures/langgraph/generated/Cargo.toml --all-features
          cargo clippy --manifest-path fixtures/langgraph/generated/Cargo.toml --all-features -- \
            -D clippy::correctness -D clippy::suspicious
          grep -R -n -m 1 'SseStream' fixtures/langgraph/generated/src
          grep -R -n -m 1 'create_and_stream_run' fixtures/langgraph/generated/src
          grep -R -n -m 1 'open_thread_sse_stream' fixtures/langgraph/generated/src


  gate:
    name: gate
    if: always()
    needs: [policy, lint, generator, bindings, integration, independent-sdk, own-api-sdk, production-compatibility, langgraph-fern]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI contract
        env:
          POLICY: ${{ needs.policy.result }}
          LINT: ${{ needs.lint.result }}
          GENERATOR: ${{ needs.generator.result }}
          BINDINGS: ${{ needs.bindings.result }}
          INTEGRATION: ${{ needs.integration.result }}
          INDEPENDENT_SDK: ${{ needs.independent-sdk.result }}
          OWN_API_SDK: ${{ needs.own-api-sdk.result }}
          PRODUCTION_COMPATIBILITY: ${{ needs.production-compatibility.result }}
          LANGGRAPH_FERN: ${{ needs.langgraph-fern.result }}
        run: |
          for result in "$POLICY" "$LINT" "$GENERATOR" "$BINDINGS" "$INTEGRATION" "$INDEPENDENT_SDK" "$OWN_API_SDK" "$PRODUCTION_COMPATIBILITY" "$LANGGRAPH_FERN"; do
            test "$result" = success
          done
