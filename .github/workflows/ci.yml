name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate agent and action-pin contracts
        run: python3 scripts/check_agent_contract.py
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py "$PR_TITLE"
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Reject high-confidence Python defects
        run: >-
          uvx --from ruff==0.16.8 ruff check
          --select E4,E7,E9,F63,F7,F82
          tests/test_bindings_integration.py scripts
          openapi-to-rust-bindings/scripts

  generator:
    name: generator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust generator
        run: cargo clippy -p rust-sdk-generator --all-targets --all-features -- -D warnings
      - name: Test Rust generator
        run: cargo test -p rust-sdk-generator --all-targets --all-features
      - name: Enforce backend-neutral dependency direction
        run: |
          test -z "$(grep -R -n -E 'openapi_to_rust_bindings|openapi-to-rust-bindings|import openapi_to_rust' src/*.rs || true)"

  bindings:
    name: bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Rust bindings adapter
        run: cargo clippy -p openapi-to-rust-bindings --all-targets --all-features -- -D warnings
      - name: Test Rust bindings adapter
        run: cargo test -p openapi-to-rust-bindings --all-targets --all-features

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --locked -p rust-sdk-generator --bin rust-sdk-generator
      - run: cargo build --locked -p openapi-to-rust-bindings --bin openapi-to-rust-bindings
      - name: Prove adapter sidecar drives the Rust CLI
        env:
          RUST_SDK_GENERATOR_BIN: target/debug/rust-sdk-generator
          OPENAPI_TO_RUST_BINDINGS_BIN: target/debug/openapi-to-rust-bindings
        run: python3 -m unittest tests.test_bindings_integration

  gate:
    name: gate
    if: always()
    needs: [policy, lint, generator, bindings, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI contract
        env:
          POLICY: ${{ needs.policy.result }}
          LINT: ${{ needs.lint.result }}
          GENERATOR: ${{ needs.generator.result }}
          BINDINGS: ${{ needs.bindings.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          for result in "$POLICY" "$LINT" "$GENERATOR" "$BINDINGS" "$INTEGRATION"; do
            test "$result" = success
          done
