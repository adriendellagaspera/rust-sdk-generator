name: Rust surface migration

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: rust-surface-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.head_ref == 'issue-21-22-rust-surface'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Rust surface migration
        run: python3 scripts/migrate_rust_surface.py
      - name: Format Rust source
        run: cargo fmt --all
      - name: Lint Rust surface
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust surface
        run: cargo test --all-targets --all-features
      - name: Commit migration and restore canonical CI
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/migrate_rust_surface.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: expose canonical Rust library and CLI surface'
          git push origin "HEAD:${HEAD_REF}"
