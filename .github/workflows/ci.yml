name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate agent and action-pin contracts
        run: python3 scripts/check_agent_contract.py
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py "$PR_TITLE"
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Reject high-confidence Python defects
        run: >-
          uvx --from ruff==0.16.8 ruff check
          --select E4,E7,E9,F63,F7,F82
          src tests scripts
          openapi-to-rust-bindings/src
          openapi-to-rust-bindings/tests

  generator:
    name: generator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize migration source and restore canonical CI
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lower.rs")
          source = path.read_text()
          if "use indexmap::IndexMap;" not in source:
              source = source.replace("use serde_json::Value;\n", "use indexmap::IndexMap;\nuse serde_json::Value;\n")
          source = source.replace(
              "fn field_map<'a>(bindings: &'a Bindings, raw: &str) -> Result<BTreeMap<String, &'a FieldBinding>> {",
              "fn field_map<'a>(bindings: &'a Bindings, raw: &str) -> Result<IndexMap<String, &'a FieldBinding>> {",
          )
          source = source.replace(
              "    fields: &BTreeMap<String, &FieldBinding>,\n",
              "    fields: &IndexMap<String, &FieldBinding>,\n",
          )
          source = source.replace(
              '                        let inner = parse_type(&raw_field.type_name)?\n                            .unary("Option")\n                            .map(|inner| inner.spelling.as_str());\n',
              '                        let raw_syntax = parse_type(&raw_field.type_name)?;\n                        let inner = raw_syntax\n                            .unary("Option")\n                            .map(|inner| inner.spelling.as_str());\n',
          )
          path.write_text(source)
          PY
          cargo fmt --all
          cargo generate-lockfile
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src Cargo.lock .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format Rust lowering slice"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Lint Rust generator
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust generator
        run: cargo test --all-targets --all-features
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv build --wheel
      - run: uv venv .test-venv --python 3.11
      - run: uv pip install --python .test-venv/bin/python dist/*.whl
      - run: .test-venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Enforce backend-neutral dependency direction
        run: |
          test -z "$(grep -R -n -E 'openapi_to_rust_bindings|openapi-to-rust-bindings|import openapi_to_rust' src/rust_sdk_generator src/*.rs || true)"

  bindings:
    name: bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv build --wheel
        working-directory: openapi-to-rust-bindings
      - run: uv venv .test-venv --python 3.11
        working-directory: openapi-to-rust-bindings
      - run: uv pip install --python .test-venv/bin/python dist/*.whl
        working-directory: openapi-to-rust-bindings
      - run: .test-venv/bin/python -m unittest discover -s tests -p 'test_*.py'
        working-directory: openapi-to-rust-bindings

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv build --wheel
      - run: uv build --wheel
        working-directory: openapi-to-rust-bindings
      - run: uv venv .integration-venv --python 3.11
      - run: uv pip install --python .integration-venv/bin/python dist/*.whl
      - run: uv pip install --python .integration-venv/bin/python tree-sitter==0.25.2 tree-sitter-rust==0.24.0
      - run: uv pip install --python .integration-venv/bin/python --no-deps openapi-to-rust-bindings/dist/*.whl
      - run: .integration-venv/bin/python -m unittest tests.test_bindings_integration

  gate:
    name: gate
    if: always()
    needs: [policy, lint, generator, bindings, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI contract
        env:
          POLICY: ${{ needs.policy.result }}
          LINT: ${{ needs.lint.result }}
          GENERATOR: ${{ needs.generator.result }}
          BINDINGS: ${{ needs.bindings.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          for result in "$POLICY" "$LINT" "$GENERATOR" "$BINDINGS" "$INTEGRATION"; do
            test "$result" = success
          done
