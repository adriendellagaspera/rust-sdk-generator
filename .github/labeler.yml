A-generator:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "tests/**"
          - "Cargo.toml"
          - "Cargo.lock"

A-bindings:
  - changed-files:
      - any-glob-to-any-file:
          - "openapi-to-rust-bindings/**"

A-ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "AGENTS.md"
          - "CLAUDE.md"

A-docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
