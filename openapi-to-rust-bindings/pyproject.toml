[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-to-rust-bindings"
version = "0.2.2"
description = "Normalize openapi-to-rust output into the rust-sdk-generator Bindings contract"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
  "jsonschema==4.26.0",
  "tree-sitter==0.26.0",
  "tree-sitter-rust==0.24.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["openapi_to_rust_bindings"]
include-package-data = true

[tool.setuptools.package-data]
openapi_to_rust_bindings = ["*.json"]
