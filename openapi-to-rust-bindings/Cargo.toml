[package]
name = "openapi-to-rust-bindings"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Normalize openapi-to-rust output into the rust-sdk-generator Bindings contract"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adriendellagaspera/rust-sdk-generator"

[lib]
name = "openapi_to_rust_bindings"
path = "src/lib.rs"

[[bin]]
name = "openapi-to-rust-bindings"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "3", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
